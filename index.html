<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N²</title>
    <!-- Import Syne: A hyper-modern, bold geometric streetwear font -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        body {
            /* Sets a solid dark tone matching the exact deep edge shadows of your logo art */
            background-color: #050505; 
            color: #ffffff;
            font-family: 'Syne', -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            overflow-x: hidden;
        }
        
        /* Absolute insurance to completely kill all link, form, or hover underlines */
        form, a, input, button, div, span {
            text-decoration: none !important;
            box-shadow: none !important;
        }

        /* Container that handles positioning the logo higher on the page */
        .logo-wrapper {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: -5vh; /* Pushes the logo upward on the screen */
            margin-bottom: 2rem; /* Clean breathing room below the logo */
        }

        /* Custom constraints for the N² logo image element */
        .logo-graphic {
            width: 80%; /* Shrinks the logo down so it isn't overwhelming on phones */
            max-width: 320px;
            height: auto;
            display: block;
            filter: drop-shadow(0 0 15px rgba(255, 0, 127, 0.2)); /* Soft subtle expansion of the pink glow */
        }

        .tagline {
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: #ffffff; /* High contrast crisp white statement */
            margin-bottom: 1.5rem;
            text-align: center;
            line-height: 1.4;
        }

        #countdown {
            font-family: monospace;
            font-size: 1.5rem;
            letter-spacing: 3px;
            margin-bottom: 3rem;
            color: #888888; /* Clean digital clock layout */
        }

        .email-form {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 320px;
        }

        .email-input {
            background: transparent;
            border: none;
            border-bottom: 2px solid #222222;
            color: #ffffff;
            font-family: 'Syne', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 12px;
            width: 100%;
            text-align: center;
            outline: none;
            letter-spacing: 1px;
            transition: border-color 0.3s;
            border-radius: 0;
        }

        .email-input:focus {
            border-bottom-color: #ff007f; /* Electric pink line on click */
        }

        .submit-btn {
            background-color: transparent;
            color: #ff007f;
            border: 1px solid #ff007f;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            padding: 12px 24px;
            margin-top: 20px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 0;
        }

        .submit-btn:hover {
            background-color: #ff007f;
            color: #000000;
            box-shadow: 0 0 20px #ff007f !important;
        }
    </style>
</head>
<body>
    
    <!-- Logo Wrapper: Controls the standalone image sizing and upward lift -->
    <div class="logo-wrapper">
        <img src="logo.png" alt="N²" class="logo-graphic">
    </div>
    
    <!-- Clean, Unified Statement Line -->
    <div class="tagline">Niagara, Squared.<br>The Midnight Drop.</div>
    
    <!-- Cryptic Ticking Clock -->
    <div id="countdown">000D : 00H : 00M : 00S</div>

    <!-- Email Collection Input -->
    <form class="email-form" action="#" method="POST">
        <input type="email" class="email-input" placeholder="ENTER EMAIL FOR PRIORITY ACCESS" required>
        <button type="submit" class="submit-btn">JOIN SYSTEM</button>
    </form>

    <script>
        // Target countdown date: Third Thursday of Nov 2027 (Nov 18, 2027 at 00:01:00)
        const targetDate = new Date("November 18, 2027 00:01:00").getTime();

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            const d = days.toString().padStart(3, '0');
            const h = hours.toString().padStart(2, '0');
            const m = minutes.toString().padStart(2, '0');
            const s = seconds.toString().padStart(2, '0');

            document.getElementById("countdown").innerHTML = `${d}D : ${h}H : ${m}M : ${s}S`;

            if (difference < 0) {
                clearInterval(timer);
                document.getElementById("countdown").innerHTML = "THE JUICE IS LOOSE";
            }
        }, 1000);
    </script>
</body>
</html>
