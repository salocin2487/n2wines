<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N²</title>
    <!-- Import Syne: A hyper-modern, bold geometric streetwear font -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Syne', -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .logo {
            font-size: 6rem;
            font-weight: 800;
            color: #ff007f; /* Electric Neon Pink */
            text-shadow: 0 0 20px #ff007f, 0 0 40px #ff007f;
            margin-bottom: 0.5rem;
            letter-spacing: -3px;
            text-transform: uppercase;
        }
        .logo sup {
            font-size: 2.8rem;
            top: -0.4em;
            font-weight: 700;
        }
        .tagline {
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: #ffffff; /* Bright white high contrast statement */
            margin-bottom: 2.5rem;
            text-align: center;
            line-height: 1.4;
        }
        #countdown {
            font-family: monospace;
            font-size: 1.5rem;
            letter-spacing: 3px;
            margin-bottom: 3.5rem;
            color: #888888; /* Muted digital clock layout */
        }
        .email-form {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 320px;
        }
        .email-input {
            background: transparent;
            border: none;
            border-bottom: 2px solid #222222;
            color: #ffffff;
            font-family: 'Syne', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 12px;
            width: 100%;
            text-align: center;
            outline: none;
            letter-spacing: 1px;
            transition: border-color 0.3s;
        }
        .email-input:focus {
            border-bottom-color: #ff007f;
        }
        .submit-btn {
            background-color: transparent;
            color: #ff007f;
            border: 1px solid #ff007f;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            padding: 12px 24px;
            margin-top: 20px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .submit-btn:hover {
            background-color: #ff007f;
            color: #000000;
            box-shadow: 0 0 20px #ff007f;
        }
    </style>
</head>
<body>

    <!-- Bold Alphanumeric Streetwear Logo -->
    <div class="logo">N<sup>2</sup></div>
    
    <!-- Clean, Unified Statement Line -->
    <div class="tagline">Niagara, Squared.<br>The Midnight Drop.</div>
    
    <!-- Cryptic Ticking Clock -->
    <div id="countdown">000D : 00H : 00M : 00S</div>

    <form class="email-form" action="#" method="POST">
        <input type="email" class="email-input" placeholder="ENTER EMAIL FOR PRIORITY ACCESS" required>
        <button type="submit" class="submit-btn">JOIN SYSTEM</button>
    </form>

    <script>
        const targetDate = new Date("November 18, 2027 00:01:00").getTime();

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            const d = days.toString().padStart(3, '0');
            const h = hours.toString().padStart(2, '0');
            const m = minutes.toString().padStart(2, '0');
            const s = seconds.toString().padStart(2, '0');

            document.getElementById("countdown").innerHTML = `${d}D : ${h}H : ${m}M : ${s}S`;

            if (difference < 0) {
                clearInterval(timer);
                document.getElementById("countdown").innerHTML = "THE JUICE IS LOOSE";
            }
        }, 1000);
    </script>
</body>
</html>
