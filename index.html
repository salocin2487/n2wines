<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N²</title>
    <!-- Import Syne: A hyper-modern, bold geometric streetwear font -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        body {
            /* Sets your logo image as the permanent, full-screen background wallpaper */
            background-image: url('logo.png');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-color: #050505; /* Deep fallback dark tone while loading */
            color: #ffffff;
            font-family: 'Syne', -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end; /* Pushes content below the centered logo glow */
            height: 100vh;
            margin: 0;
            padding-bottom: 8vh; /* Keeps interface beautifully balanced at the bottom */
            box-sizing: border-box;
            overflow: hidden;
        }
        
        /* Absolute insurance to completely kill all link, form, or hover underlines */
        form, a, input, button, div, span {
            text-decoration: none !important;
            box-shadow: none !important;
        }

        .tagline {
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: #ffffff; /* High contrast crisp white statement */
            margin-bottom: 2rem;
            text-align: center;
            line-height: 1.4;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8); /* Ensures readability over texture */
        }

        #countdown {
            font-family: monospace;
            font-size: 1.5rem;
            letter-spacing: 3px;
            margin-bottom: 3rem;
            color: #a0a0a0; /* Clean digital clock layout */
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .email-form {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 320px;
        }

        .email-input {
            background: rgba(0, 0, 0, 0.4); /* Subtle dark overlay for typing clarity */
            border: none;
            border-bottom: 2px solid #222222;
            color: #ffffff;
            font-family: 'Syne', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 12px;
            width: 100%;
            text-align: center;
            outline: none;
            letter-spacing: 1px;
            transition: all 0.3s;
            border-radius: 0;
        }

        .email-input:focus {
            border-bottom-color: #ff007f; /* Electric pink line on click */
            background: rgba(0, 0, 0, 0.6);
        }

        .submit-btn {
            background-color: transparent;
            color: #ff007f;
            border: 1px solid #ff007f;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            padding: 12px 24px;
            margin-top: 20px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 0;
        }

        .submit-btn:hover {
            background-color: #ff007f;
            color: #000000;
            box-shadow: 0 0 20px #ff007f !important;
        }
    </style>
</head>
<body>
    
    <!-- Clean, Unified Statement Line -->
    <div class="tagline">Niagara, Squared.<br>The Midnight Drop.</div>
    
    <!-- Cryptic Ticking Clock -->
    <div id="countdown">000D : 00H : 00M : 00S</div>

    <!-- Email Collection Input -->
    <form class="email-form" action="#" method="POST">
        <input type="email" class="email-input" placeholder="ENTER EMAIL FOR PRIORITY ACCESS" required>
        <button type="submit" class="submit-btn">JOIN SYSTEM</button>
    </form>

    <script>
        // Target countdown date: Third Thursday of Nov 2027 (Nov 18, 2027 at 00:01:00)
        const targetDate = new Date("November 18, 2027 00:01:00").getTime();

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            const d = days.toString().padStart(3, '0');
            const h = hours.toString().padStart(2, '0');
            const m = minutes.toString().padStart(2, '0');
            const s = seconds.toString().padStart(2, '0');

            document.getElementById("countdown").innerHTML = `${d}D : ${h}H : ${m}M : ${s}S`;

            if (difference < 0) {
                clearInterval(timer);
                document.getElementById("countdown").innerHTML = "THE JUICE IS LOOSE";
            }
        }, 1000);
    </script>
</body>
</html>
